[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketstack_ensemble_ai"
version = "0.1.0"
description = "Level-aware deep recursive ensemble learning for binary and multiclass classification"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-only"
authors = [
  { name = "Çağatay Demirel", email = "cagatay.demirel.sci@gmail.com" },
]
keywords = [
  "ensemble learning",
  "machine learning",
  "recursive stacking",
  "stacking",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "catboost>=1.2",
  "lightgbm>=3.3",
  "numpy>=1.23",
  "optuna>=3.0",
  "scikit-learn>=1.3.2,<1.8",
  "tensorflow>=2.12",
  "xgboost>=1.7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5",
]
docs = [
  "mkdocs-material>=9",
  "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://caghangir-1.github.io/RocketStack-Ensemble-Architecture-ai/"
Documentation = "https://caghangir-1.github.io/RocketStack-Ensemble-Architecture-ai/"
Source = "https://github.com/caghangir-1/RocketStack-Ensemble-Architecture-ai"
Publication = "https://doi.org/10.1016/j.eswa.2026.133521"

[tool.setuptools]
packages = ["rocketstack_ensemble_ai"]
py-modules = ["rocketstack_functions_with_model_api_original"]

[tool.setuptools.package-data]
rocketstack_ensemble_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
